<figure class="trend">
  @if (caption(); as text) {
    <figcaption class="trend__title">{{ text }}</figcaption>
  }

  <div class="trend__plot">
    <span class="trend__axis trend__axis--max">{{ axisMax() }}</span>
    <span class="trend__axis trend__axis--min">{{ axisMin() }}</span>
    <!-- Focusable so arrow keys can walk the crosshair; the readout and the
         table below carry the same values for everyone else. -->
    <svg
      class="trend__svg"
      [attr.viewBox]="viewBox"
      role="img"
      tabindex="0"
      [attr.aria-label]="ariaLabel()"
      (pointermove)="onPointerMove($event)"
      (pointerleave)="resetHover()"
      (keydown)="onKeydown($event)"
      (blur)="resetHover()"
    >
      <line class="trend__grid" x1="0" [attr.x2]="width" y1="12" y2="12" />
      <line class="trend__grid" x1="0" [attr.x2]="width" [attr.y1]="height - 12" [attr.y2]="height - 12" />
      @if (active(); as point) {
        <line class="trend__crosshair" [attr.x1]="point.x" [attr.x2]="point.x" y1="0" [attr.y2]="height" />
      }
      @for (segment of segments(); track $index) {
        <polyline class="trend__line" [attr.points]="segment" />
      }
      @if (active(); as point) {
        <circle class="trend__dot" [attr.cx]="point.x" [attr.cy]="point.y" r="4" />
      }
    </svg>
  </div>

  <div class="trend__range">
    <span>{{ start() }}</span>
    <span>{{ end() }}</span>
  </div>

  @if (active(); as point) {
    <p class="trend__readout" aria-live="polite" data-readout>
      <strong>{{ point.point.display }}</strong>
      <span>
        {{ point.point.label }}
        @if (point.point.detail) {
          · {{ point.point.detail }}
        }
      </span>
    </p>
  }
  @if (note(); as text) {
    <p class="trend__note">{{ text }}</p>
  }

  <details class="trend__table">
    <summary>{{ tableViewLabel() }}</summary>
    <table>
      <thead>
        <tr>
          <th scope="col">{{ labelHeader() }}</th>
          <th scope="col">{{ valueHeader() }}</th>
        </tr>
      </thead>
      <tbody>
        @for (point of points(); track $index) {
          <tr>
            <th scope="row">{{ point.label }}</th>
            <td>
              {{ point.display }}
              @if (point.detail) {
                ({{ point.detail }})
              }
            </td>
          </tr>
        }
      </tbody>
    </table>
  </details>
</figure>
