@if (errorKey()) {
  <p role="alert">{{ errorKey()! | translate }}</p>
} @else if (records(); as r) {
  @if (r.matches.length === 0) {
    <p class="empty-state card">{{ 'groupMemberView.matchRecords.empty' | translate }}</p>
  } @else {
    <ul class="record-list">
      @for (match of r.matches; track match.match_id) {
        <li
          app-match-card
          [match]="match"
          startFormat="HH:mm"
          [candidateFor]="candidateLookup"
          (opened)="openDetail(match.match_id)"
        ></li>
      }
    </ul>
    <app-pagination [page]="page()" [totalPages]="r.total_pages" (pageChange)="goToPage($event)" />
  }
} @else {
  <p class="loading-state" role="status">{{ 'common.loading' | translate }}</p>
}

<app-match-record-detail-dialog
  #detailDialog
  [detail]="detail()"
  [loading]="detailLoading()"
  [loadError]="detailLoadError()"
  [shareContext]="shareContext()"
/>
