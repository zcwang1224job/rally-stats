<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <h1>{{ 'reauth.title' | translate }}</h1>

  <label>
    {{ 'reauth.groupNumber' | translate }}
    <input type="number" formControlName="group_number" />
  </label>

  <label>
    {{ 'reauth.adminPin' | translate }}
    <input type="text" inputmode="numeric" maxlength="6" formControlName="admin_pin" />
  </label>

  @if (retryAfterSeconds(); as seconds) {
    <p role="alert">{{ 'reauth.lockedNotice' | translate: { seconds } }}</p>
  } @else if (errorKey(); as key) {
    <p role="alert">{{ key | translate }}</p>
  }

  <button type="submit" class="btn" [disabled]="submitting()">{{ 'reauth.submit' | translate }}</button>
</form>
