<a class="notification-bell tap-target" routerLink="/notifications" [attr.aria-label]="ariaLabel()">
  <svg
    class="notification-bell__icon"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
    <path d="M13.73 21a2 2 0 0 1-3.46 0" />
  </svg>
  @if (unreadCount() > 0) {
    <span class="notification-bell__badge">{{ displayCount() }}</span>
  }
</a>
